name: CI

# Always triggered, so the required "CI passed" check reports on every pull request;
# the jobs themselves are skipped when only documentation changed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the running workflow obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"
              - "!LICENSE"

  lint:
    name: Lint and type-check
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests against Magento
    needs: lint
    if: ${{ needs.lint.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Start Magento and Mailpit
        run: docker compose up --detach --wait --wait-timeout 420

      - run: uv sync --locked

      - name: Install Chromium for UI tests
        run: uv run playwright install --with-deps chromium

      # Three workers: the store's PHP-FPM pool serves four requests at a time.
      - name: Run tests
        run: uv run pytest -n 3 --alluredir=allure-results

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results
          path: allure-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --timestamps > compose.log

      - name: Upload container logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-logs
          path: compose.log
          retention-days: 14

  report:
    name: Build Allure report
    needs: test
    # Publish failing runs too: that is when the report matters most.
    if: ${{ !cancelled() && needs.test.result != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read  # configure-pages looks up the site URL for the report history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: allure-results
          path: allure-results

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Restore report history
        run: |
          mkdir -p allure-history
          curl -fsSL "${{ steps.pages.outputs.base_url }}/history.jsonl" -o allure-history/history.jsonl \
            || echo "No published history yet, starting a new one"

      - name: Generate report
        run: |
          npx --yes allure@3.20.0 generate allure-results --config allurerc.mjs --history-limit 30
          cp allure-history/history.jsonl allure-report/history.jsonl

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: allure-report

  # Separate job, as in GitHub's Pages workflows: deploying in the same job as the
  # upload can run before the artifact is listed and fail with "No artifacts named
  # github-pages". Re-run the whole workflow rather than this job alone, or the
  # upload is duplicated and the deploy refuses two artifacts with the same name.
  deploy:
    name: Publish Allure report
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The single check required on main: fails if any job failed or was cancelled,
  # passes when the test jobs ran green or were skipped for a docs-only change.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results of the other jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job ended with: $result"
              exit 1
            fi
          done
