name: Nightly

# The full suite every night, with the UI tests in all three browser engines.
# Pull requests run Chromium only, so they stay fast.
on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC, 05:00 in Sofia
  workflow_dispatch:
  # A change to this workflow runs it in its own pull request.
  pull_request:
    paths:
      - .github/workflows/nightly.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A failure in one browser must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: Chromium
            tests: ""  # the full suite: API, email and UI
          - browser: firefox
            label: Firefox
            tests: -m ui
          - browser: webkit
            label: WebKit
            tests: -m ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Start Magento and Mailpit
        run: docker compose up --detach --wait --wait-timeout 420

      - run: uv sync --locked

      - name: Install ${{ matrix.label }}
        run: uv run playwright install --with-deps ${{ matrix.browser }}

      # Three workers: the store's PHP-FPM pool serves four requests at a time.
      - name: Run tests
        run: >-
          uv run pytest -n 3 ${{ matrix.tests }} --browser ${{ matrix.browser }}
          --alluredir=allure-results --junitxml=junit.xml

      - name: Summarise the results
        if: ${{ !cancelled() }}
        run: uv run python -m magento_qa.reporting junit.xml "${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --timestamps > compose.log

      - name: Upload container logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs-${{ matrix.browser }}
          path: compose.log
          retention-days: 14

  # Performance smoke test with k6 on its own store, so the browser tests do not
  # share its PHP workers. See perf/smoke.js.
  performance:
    name: Performance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Magento and Mailpit
        run: docker compose up --detach --wait --wait-timeout 420

      # As the runner's user, so k6 can write perf/summary.md into the checkout.
      - name: Run k6
        run: docker compose run --rm --user "$(id -u):$(id -g)" k6

      - name: Summarise the results
        if: ${{ !cancelled() }}
        run: cat perf/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "k6 wrote no summary"

  # One report for all three browsers: pytest-playwright adds the browser to each UI
  # test's parameters, so the same test in two browsers stays two results.
  report:
    name: Build Allure report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Generate report
        run: |
          mkdir -p allure-history
          npx --yes allure@3.20.0 generate allure-results --config allurerc.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report-nightly
          path: allure-report
          retention-days: 14
