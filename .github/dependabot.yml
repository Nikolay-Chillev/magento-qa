version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Bumps the pinned Magento and Mailpit images; CI proves the suite still passes.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
