repos:
  # Through python -m, like every command in this project: Windows Smart App Control
  # can block the unsigned launchers that pip creates for the hooks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        entry: python -m pre_commit_hooks.trailing_whitespace_fixer
      - id: end-of-file-fixer
        entry: python -m pre_commit_hooks.end_of_file_fixer
      - id: check-yaml
        entry: python -m pre_commit_hooks.check_yaml
      - id: check-toml
        entry: python -m pre_commit_hooks.check_toml
      - id: check-added-large-files
        entry: python -m pre_commit_hooks.check_added_large_files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Runs in the project environment so mypy sees the installed dependencies
  # and the pydantic plugin.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run python -m mypy
        language: system
        types: [python]
        pass_filenames: false
