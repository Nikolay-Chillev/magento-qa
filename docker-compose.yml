services:
  magento:
    # Tag for readability, digest so every run uses exactly the same image.
    image: ghcr.io/controlaltdelete-nl/magento2-in-a-box/magento-project-community-edition:php84-fpm-magento2.4.9-sample-data@sha256:2c747f07a87fee76f102db254b43b598097bc3d9c9677be6631af7d9af65a3ea
    container_name: magento
    ports:
      - "8080:80"
    environment:
      # An IP address rather than "localhost": Magento sets the cookie domain to the
      # store's host, and WebKit refuses cookies for the single-label name "localhost".
      - URL=http://127.0.0.1:8080/
    volumes:
      - ./docker/magento/custom-entrypoint.sh:/data/custom-entrypoint.sh:ro
    healthcheck:
      # Ready means: test configuration applied and catalog search answering.
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/qa-config-applied &&
          curl -fsS -X POST -H 'Content-Type: application/json'
          -d '{"query":"{ products(search: \"bag\", pageSize: 1) { total_count } }"}'
          http://localhost/graphql | grep -q '"total_count":[1-9]'
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    container_name: mailpit
    ports:
      - "8025:8025"

  # Performance smoke test, only on demand, as your own user so k6 can write
  # perf/summary.md: docker compose run --rm --user "$(id -u):$(id -g)" k6
  # It shares the Magento container's network, see perf/smoke.js.
  k6:
    image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
    profiles: [perf]
    network_mode: service:magento
    depends_on:
      magento:
        condition: service_healthy
    volumes:
      - ./perf:/perf
    working_dir: /perf
    command: run --quiet smoke.js
