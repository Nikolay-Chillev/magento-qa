services:
  magento:
    # Tag for readability, digest so every run uses exactly the same image.
    image: ghcr.io/controlaltdelete-nl/magento2-in-a-box/magento-project-community-edition:php84-fpm-magento2.4.9-sample-data@sha256:98c3ad87b4bdf1f504b515378efad06995d85c32dc2b1da3f8905b3378f1fc27
    container_name: magento
    ports:
      - "8080:80"
    environment:
      - URL=http://localhost:8080/
    volumes:
      - ./docker/magento/custom-entrypoint.sh:/data/custom-entrypoint.sh:ro
    healthcheck:
      # Ready means: test configuration applied and catalog search answering.
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/qa-config-applied &&
          curl -fsS -X POST -H 'Content-Type: application/json'
          -d '{"query":"{ products(search: \"bag\", pageSize: 1) { total_count } }"}'
          http://localhost/graphql | grep -q '"total_count":[1-9]'
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    container_name: mailpit
    ports:
      - "8025:8025"
